name: Build & Release

on:
  push:
    tags:
      - "v*"          # triggered by tags like v1.0.0
  workflow_dispatch:  # manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Python ──────────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ── Dependencies ────────────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp yarl Pillow pystray pyinstaller

      # ── Build one-file exe ───────────────────────────────────────────────────
      - name: Build kodi-bridge.exe
        run: pyinstaller bridge.spec

      # ── Smoke-test: exe starts and prints help ────────────────────────────
      - name: Smoke-test exe
        run: dist\kodi-bridge.exe --help
        shell: cmd

      # ── Determine version ───────────────────────────────────────────────────
      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            ver="${GITHUB_REF#refs/tags/v}"   # strip leading "v"
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "ver=$ver" >> "$GITHUB_OUTPUT"
          else
            short=$(git rev-parse --short HEAD)
            echo "tag=dev-$short" >> "$GITHUB_OUTPUT"
            echo "ver=0.0.0-dev-$short" >> "$GITHUB_OUTPUT"
          fi

      # ── Install Inno Setup ──────────────────────────────────────────────────
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
        shell: cmd

      # ── Build installer ─────────────────────────────────────────────────────
      - name: Build installer
        run: iscc /DAppVersion=${{ steps.version.outputs.ver }} installer.iss
        shell: cmd

      # ── Create GitHub Release ────────────────────────────────────────────────
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Kodi ↔ MPC-HC Bridge ${{ steps.version.outputs.tag }}"
          body: |
            ## Kodi ↔ MPC-HC Bridge ${{ steps.version.outputs.tag }}

            ### Download
            ### Download
            | Datei | Beschreibung |
            |-------|-------------|
            | `kodi-mpchc-bridge-setup-*.exe` | Installer — Start-Menü, Autostart, Firewall, Deinstaller |

            ### Erste Schritte
            1. Setup-`*.exe` herunterladen und ausführen (kein Admin nötig)
            2. Installiert nach `%LocalAppData%\Programs\kodi-mpchc-bridge\`
            3. Kodi-Verbindungsdaten im Installer-Wizard eingeben
            4. Autostart + Firewall-Optionen bestätigen
            5. `kodi-bridge.exe` startet automatisch — **Tray-Icon** erscheint
            6. Rechtsklick auf Tray → Einstellungen oder Test-Oberfläche
            7. Log-Datei: `%LocalAppData%\Programs\kodi-mpchc-bridge\kodi-bridge.log`

            ### Bridge-Port
            Standard: **13590** (TCP, eingehend — Firewall-Regel in der GUI einrichten)

            ### Anforderungen
            - Windows 10 / 11 (64-bit)
            - Kodi mit aktiviertem Web-Server (Port 8080) + WebSocket (Port 9090)
            - MPC-HC (clsid2-Fork) mit aktiviertem Web-Interface (Port 13579)
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: |
            dist/kodi-mpchc-bridge-setup-${{ steps.version.outputs.ver }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
